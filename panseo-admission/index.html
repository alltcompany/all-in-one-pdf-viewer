<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>판서. 입시</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#fff;color:#111}
    .load{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);text-align:center}
    .brand{font-size:28px;font-weight:900;letter-spacing:-1.5px}.brand b{color:#f97316}.bar{height:4px;margin:22px 0 14px;background:#eee;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#f97316;border-radius:999px;animation:m 1.1s ease-in-out infinite alternate}.msg{font-size:14px;color:#666}
    @keyframes m{from{transform:translateX(-100%)}to{transform:translateX(285%)}}
    .err{margin-top:16px;padding:14px;border:1px solid #f3c4aa;background:#fff7ed;color:#9a3412;border-radius:12px;text-align:left;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <main class="load"><div class="box"><div class="brand">판서<b>.</b> 입시</div><div class="bar"><i></i></div><div class="msg" id="msg">최신 화면을 불러오는 중입니다.</div><div id="err"></div></div></main>
  <script>
  (async()=>{
    const stamp=Date.now();
    const res=await fetch('./manifest.json?t='+stamp,{cache:'no-store'});
    if(!res.ok) throw new Error('배포 정보를 불러오지 못했습니다.');
    const manifest=await res.json();
    document.title='판서. 입시';
    const parts=await Promise.all(manifest.files.map(async f=>{
      const r=await fetch('./'+f+'?v='+manifest.version,{cache:'force-cache'});
      if(!r.ok) throw new Error('화면 파일을 불러오지 못했습니다: '+f);
      return (await r.text()).trim();
    }));
    const binary=atob(parts.join(''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('최신 Chrome 또는 Edge 브라우저에서 열어주세요.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  })().catch(err=>{
    document.getElementById('msg').textContent='화면을 열지 못했습니다.';
    document.getElementById('err').innerHTML='<div class="err"><b>오류</b><br>'+String(err.message||err)+'<br><br>페이지를 새로고침해 주세요.</div>';
    console.error(err);
  });
  </script>
</body>
</html>
