<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>판서. 입시</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#fff;color:#111}
    .load{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);text-align:center}
    .brand{font-size:30px;font-weight:900;letter-spacing:-1.7px}.brand b{color:#f97316}.bar{height:4px;margin:22px 0 14px;background:#eee;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#f97316;border-radius:999px;animation:m 1.1s ease-in-out infinite alternate}.msg{font-size:14px;color:#666}
    .err{margin-top:16px;padding:15px;border:1px solid #fdba8c;background:#fff7ed;color:#9a3412;border-radius:12px;text-align:left;font-size:13px;line-height:1.65}
    .retry{display:inline-flex;margin-top:12px;border:0;border-radius:9px;background:#111;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}
    #payloadFrame{position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0;pointer-events:none}
    @keyframes m{from{transform:translateX(-100%)}to{transform:translateX(285%)}}
  </style>
</head>
<body>
  <main class="load"><div class="box"><div class="brand">판서<b>.</b> 입시</div><div class="bar"><i></i></div><div class="msg" id="msg">최신 화면을 여는 중입니다.</div><div id="err"></div></div></main>
  <iframe id="payloadFrame" title="배포 데이터" aria-hidden="true"></iframe>
  <script>
  (()=>{
    const VERSION='d022cdd15d0341b7';
    const PAYLOAD='./app-d022cdd15d03.txt?v='+VERSION;
    const frame=document.getElementById('payloadFrame');
    let finished=false;
    const timer=setTimeout(()=>showError(new Error('화면 파일 응답이 지연되고 있습니다.')),20000);

    frame.addEventListener('load',async()=>{
      if(finished)return;
      try{
        const doc=frame.contentDocument||frame.contentWindow.document;
        let encoded=((doc&&doc.body&&(doc.body.innerText||doc.body.textContent))||'').replace(/\s+/g,'');
        if(!encoded||encoded.length<1000)throw new Error('화면 파일을 읽지 못했습니다.');
        const binary=atob(encoded);
        const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
        if(typeof DecompressionStream==='undefined')throw new Error('브라우저가 압축 해제를 지원하지 않습니다. Chrome 또는 Edge에서 열어주세요.');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        if(!html.includes('<html')&&!html.includes('<!doctype'))throw new Error('화면 파일 형식이 올바르지 않습니다.');
        finished=true;clearTimeout(timer);
        document.open();document.write(html);document.close();
      }catch(err){showError(err)}
    });
    frame.addEventListener('error',()=>showError(new Error('화면 파일을 불러오지 못했습니다.')));
    frame.src=PAYLOAD;

    function showError(err){
      if(finished)return;finished=true;clearTimeout(timer);
      const msg=document.getElementById('msg');if(msg)msg.textContent='화면을 열지 못했습니다.';
      const box=document.getElementById('err');if(box)box.innerHTML='<div class="err"><b>오류</b><br>'+escapeHtml(String(err&&err.message||err))+'<br><button class="retry" onclick="location.reload()">다시 열기</button></div>';
      console.error(err);
    }
    function escapeHtml(v){return v.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  })();
  </script>
</body>
</html>
